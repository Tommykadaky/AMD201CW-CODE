; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; Before the first build: copy include/config.example.h to include/config.h and fill it in.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

lib_deps =
    bblanchon/ArduinoJson@^7.2.0

monitor_speed = 115200
; COM port of the board on your computer (Device Manager -> Ports). Remove these two lines to let PlatformIO auto-detect.
upload_port = COM5
monitor_port = COM5

; ---------------------------------------------------------------------------
; Upload over Wi-Fi (OTA). The board must already run firmware 1.2.0+ (uploaded once over USB)
; and be on the same Wi-Fi as the computer.
;   1. Set upload_port below to the board's IP (Serial Monitor shows "[OTA] Ready: ...",
;      the app shows it in Settings -> IoT device). "treeo-esp32.local" also works if mDNS works on your PC.
;   2. In the terminal, once per session:   $env:TREEO_OTA_PASSWORD = "same as OTA_PASSWORD in config.h"
;   3. Upload with:   pio run -e esp32dev_ota -t upload
;      (or pick "env:esp32dev_ota" in the PlatformIO bottom bar, then Upload)
; ---------------------------------------------------------------------------
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = 192.168.0.103
upload_flags =
    --auth=${sysenv.TREEO_OTA_PASSWORD}
